<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Lazy Deck</title>
<script src="./libs/locales.js"></script>
<script src="./libs/i18n.js"></script>
<script src="./libs/sdpi-components.js"></script>
<style>.hint{color:#9d9a94;font-size:11px;line-height:1.5;padding:4px 0 8px}</style>
</head>
<body>
<sdpi-item label="Zeigt"><sdpi-select setting="kind" default="timer"><option value="timer">Timer (Eieruhr)</option><option value="stopwatch">Stoppuhr</option><option value="countdown">Countdown</option></sdpi-select></sdpi-item>
<div class="pick" data-for="timer" hidden><sdpi-item label="Dauer"><sdpi-select setting="minutes" default="10"><option value="10">10 Minuten</option><option value="1">1 Minute</option><option value="3">3 Minuten</option><option value="5">5 Minuten</option><option value="15">15 Minuten</option><option value="20">20 Minuten</option><option value="30">30 Minuten</option><option value="45">45 Minuten</option><option value="60">1 Stunde</option></sdpi-select></sdpi-item>
<div class="hint">Eieruhr: drücken startet/pausiert, halten setzt zurück. Wenn sie abläuft, meldet sich Sam.</div></div>
<div class="pick" data-for="stopwatch" hidden><div class="hint">Drücken startet/stoppt, halten setzt zurück.</div></div>
<div class="pick" data-for="countdown" hidden><sdpi-item label="Bis"><sdpi-select setting="mode" default="feierabend"><option value="feierabend">Feierabend</option><option value="weekend">Wochenende (Freitag)</option></sdpi-select></sdpi-item>
<sdpi-item label="Uhrzeit"><sdpi-textfield setting="time" placeholder="17:00" default="17:00"></sdpi-textfield></sdpi-item>
<div class="hint">Wie lange noch bis Feierabend oder Wochenende.</div></div>
<script>
(() => {
	const update = (v) => document.querySelectorAll(".pick").forEach((el) => { el.hidden = el.dataset.for !== (v || "timer"); });
	update();
	SDPIComponents.useSettings("kind", update);
	document.querySelector('sdpi-select[setting="kind"]').addEventListener("valuechange", (ev) => update(ev.target.value));
})();
</script>
</body>
</html>
