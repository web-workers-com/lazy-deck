<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Lazy Deck</title>
<script src="./libs/sdpi-components.js"></script>
<style>.hint{color:#9d9a94;font-size:11px;line-height:1.5;padding:4px 0 8px}</style>
</head>
<body>
<sdpi-item label="Nach"><sdpi-select setting="minutes" default="30"><option value="30">30 Minuten</option><option value="60">1 Stunde</option><option value="90">1,5 Stunden</option><option value="120">2 Stunden</option></sdpi-select></sdpi-item>
<sdpi-item label="Dann"><sdpi-select setting="how" default="shutdown"><option value="shutdown">Herunterfahren</option><option value="sleep">Energiesparen</option></sdpi-select></sdpi-item>
<div class="hint">PC aus oder schlafen in 30, 60 oder 90 Minuten, z. B. abends beim Film. Nochmal drücken: 30 Minuten mehr, halten: abbrechen. Eine Minute vorher sagt Sam Bescheid.</div>
</body>
</html>
