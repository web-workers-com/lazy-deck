<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<title>Lazy Deck</title>
<script src="./libs/sdpi-components.js"></script>
<style>.hint{color:#9d9a94;font-size:11px;line-height:1.5;padding:4px 0 8px}.hint code{color:#F2B544;word-break:break-all}</style>
</head>
<body>
<sdpi-item label="Aktion"><sdpi-select setting="mode" default="mute"><option value="mute">Mikro stumm</option><option value="deafen">Taub schalten</option><option value="open">Discord öffnen</option></sdpi-select></sdpi-item>
<div class="hint">Schaltet nur Discord stumm, direkt in Windows, egal welches Mikro in Discord gewählt ist. Dafür muss nichts eingestellt werden. Discords eigenes Stumm-Symbol bleibt dabei aus, die Taste zeigt den echten Zustand. Taub schaltet Discords Ton und Mikro zusammen.</div>
</body>
</html>
